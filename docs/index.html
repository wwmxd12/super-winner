<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>贪吃蛇 Snake</title>
<style>
  /* 页面外壳：把画布居中，底色跟游戏里保持一致 */
  html, body {
    margin: 0;
    height: 100%;
    background: #0b0d0b;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    color: #9fb89a;
    /* 手机上别让滑动页面把游戏滚走 */
    overscroll-behavior: none;
  }
  canvas {
    /* 逻辑尺寸永远是 500x500，这里只是把它"显示"成多大：
       屏幕宽就用 500，屏幕窄（手机）就缩到 92% 宽，正方形比例不变 */
    width: min(500px, 92vw);
    height: min(500px, 92vw);
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, .6);
    touch-action: none; /* 交给 JS 自己处理触摸，浏览器不要插手 */
  }
  .hint { margin-top: 14px; font-size: 13px; text-align: center; line-height: 1.7; }
  .hint b { color: #cfe8c8; font-weight: 600; }
  /* 调试读数：等宽字 + 淡一点，不跟游戏抢眼神 */
  #fps { margin-top: 6px; font-family: Consolas, monospace; font-size: 12px; color: #5f7a5a; }
</style>
</head>
<body>

<canvas id="game"></canvas>

<p class="hint">
  <b>方向键</b> 或 <b>WASD</b> 控制 · <b>空格</b> 重开 · 手机直接<b>滑动</b><br>
  灰黑那条是<b>电脑蛇</b>，跟你抢苹果、撞墙撞身子都会晕；<br>
  它晕了会把吃过的苹果撒回自己身上，<b>5 秒</b>后重新上场
</p>
<p id="fps">读数初始化中…</p>

<script>
"use strict";

/* =====================================================================
   这份代码是 GamePanel.java 的"网页孪生版"。
   方法名、变量名、执行顺序都刻意跟 Java 那份一一对应，
   方便你拿两边对照着读：看懂一个，就看懂了另一个。
   ===================================================================== */

// ============ 一、棋盘的物理设定（和 Java 版完全一样的四个数字）============
const UNIT_SIZE  = 20;                        // 一个格子边长 20 像素
const GAME_UNITS = 25;                        // 横竖各 25 个格子
const PANEL_SIZE = UNIT_SIZE * GAME_UNITS;    // 所以画布是 500 x 500
const DELAY      = 130;                       // 每隔 130 毫秒走一步（越小越快）

// 下面三个是加了电脑蛇之后的"规则数字"，想调难度只改这里
const START_PARTS = 6;      // 开局几节身体：玩家和电脑一模一样
const RESPAWN_MS  = 5000;   // 电脑蛇死后隔多少毫秒复活
const MAX_APPLES  = 12;     // 棋盘上同时最多几颗苹果（防止电脑反复死把盘子堆满）

// ============ 二、配色表：想换造型只改这里 ============
const C = {
  bgDark:    [14, 16, 14],   // 棋盘格深的那一格
  bgLight:   [24, 28, 24],   // 棋盘格浅的那一格
  apple:     [255, 88, 96],  // 苹果本体
  appleShine:[255, 190, 195],// 苹果高光
  leaf:      [126, 214, 96], // 苹果叶子
  eyeWhite:  [255, 255, 255],// 眼白
  pupil:     [40, 40, 40],   // 瞳孔
};

// 每条蛇一套配色。画身体的代码只写一遍，颜色由传进去的这套决定，
// 所以"给电脑蛇换个颜色"= 只改下面其中一行。
const PAL_P = {             // 玩家：嫩绿
  head: [126, 235, 96], bodyMid: [92, 210, 70], bodyDark: [46, 170, 32],
  tongue: [255, 120, 150],
};
const PAL_E = {             // 电脑：灰黑
  // 注意别真用纯黑：底色本来就是近黑的深绿，纯黑蛇会糊成一片看不见。
  // 用"银灰 → 炭灰"这一档，既是你说的灰黑，又跟背景分得开。
  head: [178, 186, 194], bodyMid: [120, 128, 137], bodyDark: [72, 78, 86],
  tongue: [206, 96, 112],
};
// 网页里"改一个颜色"比 Java 方便：不用 new，直接拿数组描述，用的时候再拼成字符串
const rgb = (c) => `rgb(${c[0]}, ${c[1]}, ${c[2]})`;

// ============ 三、画布：相当于 Java 里那个 JPanel ============
const canvas = document.getElementById("game");
const g = canvas.getContext("2d");

// 高分屏适配：笔记本/手机屏幕一个 CSS 像素可能对应 2~3 个真实像素点。
// 把画布的"真实分辨率"放大 DPR 倍，再把笔整体缩放 DPR 倍，
// 于是我们照样在 0~500 的坐标系里画画，但边缘不会糊。
// （Java 版没有这一步，因为 Swing 的窗口本来就是原生分辨率。）
const DPR = Math.min(window.devicePixelRatio || 1, 2);
canvas.width  = PANEL_SIZE * DPR;
canvas.height = PANEL_SIZE * DPR;
g.scale(DPR, DPR);

// 抗锯齿：Java 版要手动 setRenderingHint 打开，Canvas 是**默认就开着**的，白捡。

// ============ 四、两条蛇的数据 ============
// 原来只有一个玩家，变量直接摊在外面（snakeX / bodyParts / …）。
// 现在加了电脑蛇，就把它打包成一个对象：两条蛇形状完全相同，
// 于是"移动 / 撞墙 / 吃苹果 / 画身体"这些代码只写一遍，两条蛇共用。
function makeSnake(pal, name) {
  const N = GAME_UNITS * GAME_UNITS;
  return {
    x: new Array(N).fill(0),   // 每节的格坐标（存的是像素值，都是 20 的整数倍）
    y: new Array(N).fill(0),
    px: new Array(N).fill(0),  // 【丝滑的关键】上一步的格坐标快照，插值用
    py: new Array(N).fill(0),
    parts: START_PARTS,        // 现在有几节
    score: 0,                  // 吃了几颗苹果 = 得分
    dir: "R",                  // 蛇头朝向：U 上 / D 下 / L 左 / R 右
    alive: true,               // 活着吗
    respawnAt: 0,              // 死了的话，游戏时间到多少毫秒复活
    pal: pal,
    name: name,
  };
}

const P = makeSnake(PAL_P, "玩家");   // 你
const E = makeSnake(PAL_E, "电脑");   // 对手：长度、速度、起步节数跟 P 一模一样

// 四个朝向对应的"每走一步偏移几格"：[dx, dy]。
// 有了这张表，前进、算 AI 候选格、画五官共用一套，不用写四套 if。
const DIRV = { U: [0, -1], D: [0, 1], L: [-1, 0], R: [1, 0] };
const BACK = { U: "D", D: "U", L: "R", R: "L" };   // 反方向，用来禁止 180 度掉头

const rnd = (n) => Math.floor(Math.random() * n);    // 0 ~ n-1 的随机整数

// 苹果从"一个坐标"改成"一份清单"：电脑蛇死的时候要把吃掉的苹果撒回躯体上，
// 盘子上就可能同时躺着好几颗，所以必须用数组才装得下。
const apples = [];             // 每个元素是 { x, y }，苹果所在格子的左上角像素坐标

// 是不是触屏设备（手机/平板）。下面"晕过去"那行提示要拿它决定写"按空格"还是"点一下"，
// 所以必须放在文件开头就算好 —— 谁在前面用，谁就得先声明。
const isTouch = window.matchMedia("(pointer: coarse)").matches;

// 最高分：Java 版关掉程序就忘了，网页版存进 localStorage，下次打开还在。
// （浏览器不允许网页随便往你电脑写文件，但给了一小块"便签纸"存这种小数据。）
const HS_KEY = "snake-high-score";
let highScore = 0;
try {
  highScore = Number(localStorage.getItem(HS_KEY)) || 0;
} catch (e) {
  highScore = 0; // 极少数隐私模式下读写会报错，忽略即可，不影响玩
}

// ---- 循环状态 ----
let rafId = null;      // requestAnimationFrame 的编号，null = 循环没在跑
let lastFrame = 0;     // 上一帧的时间戳
let acc = 0;           // 当前这一步已经攒了多少毫秒（0 ~ DELAY）
let nowMs = 0;         // 本帧的绝对时间，给舌头那种"按秒呼吸"的小动画用
let gameMs = 0;        // 本局已经玩了多久。复活倒计时用它而不是 nowMs：
                       // 切走标签页时循环会停、gameMs 也跟着停，
                       // 不会出现"离开五分钟、回来电脑蛇早就复活了"

// ============ 五、开局与投放苹果 ============

/** 摆一条蛇：头在 (headCol, row)，身体沿"朝向的反方向"往后排 */
function placeSnake(s, headCol, row) {
  const back = s.dir === "R" ? -1 : 1;   // 朝右身体排在左边，朝左身体排在右边
  for (let i = 0; i < s.parts; i++) {
    s.x[i] = (headCol + back * i) * UNIT_SIZE;
    s.y[i] = row * UNIT_SIZE;
  }
}

/** 把一条蛇重置成开局状态 */
function resetSnake(s, dir, headCol, row) {
  s.dir = dir;
  s.parts = START_PARTS;
  s.score = 0;
  s.alive = true;
  s.respawnAt = 0;
  placeSnake(s, headCol, row);
  syncPrev(s);   // 开局时"上一步"和"这一步"重合，蛇不会自己飘
}

/** 把一局的所有初始状态摆好 */
function newGame() {
  apples.length = 0;
  gameMs = 0;

  // 玩家：左上角，头朝右
  resetSnake(P, "R", 5, 5);
  // 电脑：右下角，头朝左 —— 开局离你最远，不会一上来就贴脸
  resetSnake(E, "L", GAME_UNITS - START_PARTS, GAME_UNITS - 6);

  spawnApple();
}

/** 这个格子上有没有活蛇的身体（死蛇不算，它已经不存在了） */
function cellBusy(x, y) {
  for (const s of [P, E]) {
    if (!s.alive) continue;
    for (let i = 0; i < s.parts; i++) {
      if (s.x[i] === x && s.y[i] === y) return true;
    }
  }
  return false;
}

/** 苹果清单里 (x,y) 这一格是第几颗；没有就返回 -1 */
function appleIndexAt(x, y) {
  for (let i = 0; i < apples.length; i++) {
    if (apples[i].x === x && apples[i].y === y) return i;
  }
  return -1;
}

/** 在棋盘上随机扔一颗苹果：落到蛇身上或已有苹果的地方就重扔 */
function spawnApple() {
  if (apples.length >= MAX_APPLES) return;   // 堆满了就不再补，不然能刷满一盘
  for (let tries = 0; tries < 400; tries++) {
    const x = rnd(GAME_UNITS) * UNIT_SIZE;
    const y = rnd(GAME_UNITS) * UNIT_SIZE;
    if (!cellBusy(x, y) && appleIndexAt(x, y) < 0) {
      apples.push({ x: x, y: y });
      return;
    }
  }
}

// ============ 六、游戏循环：逻辑走格子，画面按秒滑 ============

/** 把"当前格坐标"复制一份当作"上一步的格坐标"，插值才有起点。
    注意多抄一格（i <= parts）：advance() 会往那个空位里写东西。 */
function syncPrev(s) {
  for (let i = 0; i <= s.parts; i++) {
    s.px[i] = s.x[i];
    s.py[i] = s.y[i];
  }
}

/**
 * 走一格。两条蛇是"同时"动的，所以顺序很讲究：
 * 先各自记起点 → 电脑想一想往哪走 → 两条蛇同时挪 → 再统一判撞 → 最后各自认领苹果。
 * 如果让玩家先挪完、先判撞、先吃苹果，电脑就永远慢半拍，抢不过你。
 */
function step() {
  syncPrev(P);
  if (E.alive) syncPrev(E);

  aiThink();

  advance(P);
  if (E.alive) advance(E);

  // 两条蛇都落位之后再统一判撞，谁也不占先后便宜。
  // 头对头必须排在最前面判：它要的是"两个一起死"。放在后面的话，
  // 先被检查的那条会先因为"撞进对方身体"单独死掉，另一条反而白捡一条命。
  checkHeadToHead();
  checkCollision(P);
  if (E.alive) checkCollision(E);

  eatApples();

  if (apples.length === 0) spawnApple();
  tryRespawn();
}

/** 启动画面循环 */
function startLoop() {
  if (rafId !== null) return; // 已经在跑了，别重复启动
  lastFrame = performance.now();
  rafId = requestAnimationFrame(loop);
}

function stopLoop() {
  if (rafId !== null) {
    cancelAnimationFrame(rafId);
    rafId = null;
  }
}

/** 重开一局 */
function restart() {
  newGame();
  acc = 0;
  startLoop();
}

// ---- 实时读数：把"到底是不是逐帧在动"变成看得见的数字 ----
// 最有用的不是帧率本身，而是第二行："每一格切成几帧画"。
// 这个数 = 1 就是旧的顿挫感；接近 8 才说明插值真的在起作用。
const fpsEl = document.getElementById("fps");
let fpsFrames = 0;
let fpsSince = performance.now();   // 不这么初始化的话，第一行读数会算出一个假数字

function updateFps(now) {
  fpsFrames++;
  if (now - fpsSince < 500) return;      // 每半秒才更新一次，不拖慢游戏
  const fps = fpsFrames * 1000 / (now - fpsSince);
  fpsFrames = 0;
  fpsSince = now;
  fpsEl.textContent =
    "屏幕刷新 " + fps.toFixed(0) + " 帧/秒 · 每一格切成 "
    + (fps * DELAY / 1000).toFixed(1) + " 帧画（= 1 就是在跳格子）";
}

/**
 * 每一屏刷新跑一次（约 60 次/秒）。
 * 关键区别：它不是"每 130 毫秒才动一下"，而是
 * "每 130 毫秒才走一格，但每一帧都把蛇画在这一格的途中"。
 */
function loop(now) {
  nowMs = now;
  updateFps(now);

  // 这一帧距离上一帧过了多久。切后台再回来会一次性报一个巨大的数，
  // 不夹住的话蛇会瞬移十几格，所以封顶 100 毫秒。
  const dt = Math.min(now - lastFrame, 100);
  lastFrame = now;

  if (P.alive) {
    gameMs += dt;          // 本局计时：电脑蛇的复活倒计时看它
    acc += dt;
    // 攒够一个 DELAY 就走一格；一次循环里可能要走好几格（掉帧时自动补上）
    while (acc >= DELAY && P.alive) {
      acc -= DELAY;
      step();
    }
  } else {
    // 你已经晕了：这一局结束，不再走格子，只让最后那一步滑到底再定格
    acc = Math.min(acc + dt, DELAY);
  }

  draw();

  // 游戏结束后，等最后一步滑完就彻底停掉循环，不空转费电
  if (P.alive || acc < DELAY) {
    rafId = requestAnimationFrame(loop);
  } else {
    rafId = null;
  }
}

/** 核心：让一条蛇往前挪一格（这段逻辑和 Java 版逐行对应）*/
function advance(s) {
  // 【第 1 步】身体依次前移
  for (let i = s.parts; i > 0; i--) {
    s.x[i] = s.x[i - 1];
    s.y[i] = s.y[i - 1];
  }

  // 【第 2 步】单独算蛇头的新位置（拿上面那张方向向量表，不写 switch）
  const d = DIRV[s.dir];
  s.x[0] += d[0] * UNIT_SIZE;
  s.y[0] += d[1] * UNIT_SIZE;
}

/** 撞墙 / 撞自己 / 撞对方。判定只看离散的格子坐标，绝不用插值后的画面坐标 */
function checkCollision(s) {
  const hx = s.x[0], hy = s.y[0];

  // 情况 A：蛇头撞到四条边框
  if (hx < 0 || hx >= PANEL_SIZE || hy < 0 || hy >= PANEL_SIZE) { kill(s); return; }

  // 情况 B：蛇头撞到自己身上（从 1 开始，不能跟自己撞）
  for (let i = 1; i < s.parts; i++) {
    if (s.x[i] === hx && s.y[i] === hy) { kill(s); return; }
  }

  // 情况 C：撞进对方身体。两条蛇互相当墙，否则身体会叠在一起看不清谁是谁
  const other = s === P ? E : P;
  if (other.alive) {
    for (let i = 0; i < other.parts; i++) {
      if (other.x[i] === hx && other.y[i] === hy) { kill(s); return; }
    }
  }
}

/** 头对头：撞进同一格，或者一步之内互相穿过去，两个都不活 */
function checkHeadToHead() {
  if (!P.alive || !E.alive) return;
  const sameCell = P.x[0] === E.x[0] && P.y[0] === E.y[0];
  const swapped  = P.x[0] === E.px[0] && P.y[0] === E.py[0]
                && E.x[0] === P.px[0] && E.y[0] === P.py[0];
  if (sameCell || swapped) { kill(P); kill(E); }
}

/** 让一条蛇晕过去。已经晕了的不重复处理，免得苹果撒两遍、最高分存两遍 */
function kill(s) {
  if (!s.alive) return;
  s.alive = false;

  if (s === E) {
    // 电脑蛇：把吃掉的苹果撒回躯体上，并排一个复活时间点
    dropApplesOnBody(E);
    E.respawnAt = gameMs + RESPAWN_MS;
  } else if (P.score > highScore) {
    // 玩家：这一局结束，刷新最高分
    highScore = P.score;
    try { localStorage.setItem(HS_KEY, String(highScore)); } catch (e) { /* 存不进去就算了 */ }
  }
  // 注意：这里**不能**停掉循环。还得靠它把"最后一步滑到墙边"和淡入的黑纱画完，
  // loop() 自己会在滑完之后停下来。
}

/** 电脑蛇晕了：把它吃掉的每一颗苹果，随机还回它躯体占过的格子上 */
function dropApplesOnBody(s) {
  const cells = [];
  for (let i = 0; i < s.parts; i++) cells.push({ x: s.x[i], y: s.y[i] });

  // 洗牌（Fisher-Yates）：从躯体里随机挑格子，而不是固定从蛇头那头往下拿
  for (let i = cells.length - 1; i > 0; i--) {
    const j = rnd(i + 1);
    const tmp = cells[i]; cells[i] = cells[j]; cells[j] = tmp;
  }

  let n = s.score;                        // 吃掉几颗就撒几颗
  for (const c of cells) {
    if (n <= 0 || apples.length >= MAX_APPLES) break;
    // 撞墙死的时候蛇头那一节是在棋盘外（x 可能是 500 或 -20），
    // 不排掉的话苹果会被撒到屏幕看不见的位置，永远吃不到。
    if (c.x < 0 || c.x >= PANEL_SIZE || c.y < 0 || c.y >= PANEL_SIZE) continue;
    if (cellBusy(c.x, c.y)) continue;             // 落在活蛇身上就换下一格
    if (appleIndexAt(c.x, c.y) >= 0) continue;    // 同一格不放两颗
    apples.push(c);
    n--;
  }
}

/** 两条蛇各自认领：蛇头停在有苹果的格子上就吃掉、变长一节 */
function eatApples() {
  for (const s of [P, E]) {
    if (!s.alive) continue;
    const ai = appleIndexAt(s.x[0], s.y[0]);
    if (ai < 0) continue;
    apples.splice(ai, 1);
    s.parts++;
    // 新长出来的那一节，"上一步位"就当作和"这一步位"相同：
    // 不填这句，它会从数组里残留的旧坐标"飞"过来，看着像抽风。
    // （物理上也是对的：蛇长大时，尾巴那一节是站在原地不动的。）
    s.px[s.parts - 1] = s.x[s.parts - 1];
    s.py[s.parts - 1] = s.y[s.parts - 1];
    s.score++;
  }
}

/** 到点就把电脑蛇放回棋盘 */
function tryRespawn() {
  if (E.alive || gameMs < E.respawnAt) return;
  if (!respawnEnemy()) E.respawnAt = gameMs + 1000;   // 塞不下，一秒后再试
}

/** 在棋盘上找一个能放下整条蛇的空位。找到就复活并返回 true */
function respawnEnemy() {
  E.dir = "R";
  for (let tries = 0; tries < 80; tries++) {
    const row = rnd(GAME_UNITS);
    // 头所在的列至少要从 START_PARTS-1 起，否则身体会排到棋盘外面
    const col = (START_PARTS - 1) + rnd(GAME_UNITS - (START_PARTS - 1));
    let ok = true;
    for (let i = 0; i < START_PARTS; i++) {
      const x = (col - i) * UNIT_SIZE, y = row * UNIT_SIZE;
      if (cellBusy(x, y) || appleIndexAt(x, y) >= 0) { ok = false; break; }
    }
    // 不能贴着脸复活：那样你根本来不及反应，白白撞死在它身上。
    // 蛇头至少离玩家蛇头三个格子远。
    if (ok && P.alive) {
      const gap = Math.abs(col * UNIT_SIZE - P.x[0]) + Math.abs(row * UNIT_SIZE - P.y[0]);
      if (gap < 3 * UNIT_SIZE) ok = false;
    }
    if (!ok) continue;
    E.parts = START_PARTS;
    E.score = 0;
    E.alive = true;
    placeSnake(E, col, row);
    syncPrev(E);
    return true;
  }
  return false;
}

// ---------------- 电脑蛇的脑子：很笨但够用的贪心 ----------------

/** 这个格子对 s 来说是不是一步就死：出界、撞自己、撞对方 */
function cellIsDeadly(x, y, s) {
  if (x < 0 || x >= PANEL_SIZE || y < 0 || y >= PANEL_SIZE) return true;
  for (let i = 1; i < s.parts; i++) {
    if (s.x[i] === x && s.y[i] === y) return true;
  }
  const other = s === P ? E : P;
  if (other.alive) {
    for (let i = 0; i < other.parts; i++) {
      if (other.x[i] === x && other.y[i] === y) return true;
    }
  }
  return false;
}

/**
 * 电脑蛇每一步想一次：哪颗苹果离我最近，就往能缩短距离的方向走；
 * 但先排掉"一步就死"的方向。如果四个方向全都会死，就挑离苹果最近的那个
 * —— 反正要死，而且它死在哪里，哪里就会下苹果雨，那正是你要的东西。
 */
function aiThink() {
  if (!E.alive || apples.length === 0) return;   // 没苹果就懒得动，保持原方向

  // 1. 找离蛇头最近的一颗苹果（曼哈顿距离：横竖各好几格相加）
  let target = null, targetD = Infinity;
  for (const a of apples) {
    const d = Math.abs(a.x - E.x[0]) + Math.abs(a.y - E.y[0]);
    if (d < targetD) { targetD = d; target = a; }
  }

  // 2. 四个方向里，先排掉 180 度掉头
  const cands = [];
  for (const k in DIRV) {
    if (k !== BACK[E.dir]) cands.push(k);
  }

  // 3. 在候选里选"离苹果最近、且不会一步就死"的那个
  let safest = null,  safestRank  = Infinity;   // 能活的方向里最好的
  let fastest = null, fastestRank = Infinity;   // 不管死活，最接近苹果的
  for (const k of cands) {
    const nx = E.x[0] + DIRV[k][0] * UNIT_SIZE;
    const ny = E.y[0] + DIRV[k][1] * UNIT_SIZE;
    const rank = Math.abs(target.x - nx) + Math.abs(target.y - ny);
    if (rank < fastestRank) { fastestRank = rank; fastest = k; }
    if (!cellIsDeadly(nx, ny, E) && rank < safestRank) { safestRank = rank; safest = k; }
  }

  if (safest !== null) E.dir = safest;
  else if (fastest !== null) E.dir = fastest;
}

// ============ 七、把当前状态画到屏幕上 ============

/** 小工具：画实心椭圆。参数含义跟 Java 的 fillOval 完全一致（x,y 是左上角）*/
function fillOval(x, y, w, h) {
  g.beginPath();
  g.ellipse(x + w / 2, y + h / 2, w / 2, h / 2, 0, 0, Math.PI * 2);
  g.fill();
}

/** 小工具：画实心圆角矩形，对应 Java 的 fillRoundRect。
    Canvas 其实有现成的 roundRect()，但老浏览器没有，所以自己用 arcTo 兜一圈更保险。*/
function fillRoundRect(x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2); // 圆角不能比半边还大，否则画不出来
  g.beginPath();
  g.moveTo(x + rr, y);
  g.arcTo(x + w, y,     x + w, y + h, rr);
  g.arcTo(x + w, y + h, x,     y + h, rr);
  g.arcTo(x,     y + h, x,     y,     rr);
  g.arcTo(x,     y,     x + w, y,     rr);
  g.closePath();
  g.fill();
}

/** 一帧画面的总调度：从最底层往上涂 */
function draw() {
  // 本帧的"这一步走了几成"：0 = 刚起步，1 = 已经到位。
  // 下面所有图形都拿它做一次插值，于是 60 帧里每一帧蛇都在不同的像素上。
  const t = Math.min(acc / DELAY, 1);

  drawBoard();

  if (!P.alive) {
    // 死了：先蒙一层半透明的黑纱，蛇和字再画在纱上面。
    // 透明度跟着 t 从 0 长到满，黑纱是"淡入"而不是"啪一下盖上来"。
    g.fillStyle = "rgba(0, 0, 0, " + (0.59 * t).toFixed(3) + ")";
    g.fillRect(0, 0, PANEL_SIZE, PANEL_SIZE);
  }

  drawApples();

  // 先画电脑、再画玩家：万一两节身体重叠，你的绿蛇压在灰蛇上面，一眼能分清
  if (E.alive) drawSnake(E, t);
  drawSnake(P, t);

  if (P.alive) drawScore();
  else gameOver(t);
}

// 撞墙时蛇头的格子坐标会落到棋盘外（比如 x = 500），照直画会整节滑出画面“消失”。
// 允许它往墙里探 6 像素再停住，看着像“撞上去”而不是“穿墙消失”。
const OVERSHOOT = 6;
const MIN_POS = -OVERSHOOT;
const MAX_POS = PANEL_SIZE - UNIT_SIZE + OVERSHOOT;

/** 第 i 节本帧该画在哪：从"上一步的格子"滑到"这一步的格子"，滑到 t 这一成 */
function segX(s, i, t) {
  const v = s.px[i] + (s.x[i] - s.px[i]) * t;
  return Math.max(MIN_POS, Math.min(MAX_POS, v));
}

function segY(s, i, t) {
  const v = s.py[i] + (s.y[i] - s.py[i]) * t;
  return Math.max(MIN_POS, Math.min(MAX_POS, v));
}

/** 背景：若隐若现的棋盘格 */
function drawBoard() {
  for (let row = 0; row < GAME_UNITS; row++) {
    for (let col = 0; col < GAME_UNITS; col++) {
      g.fillStyle = rgb(((row + col) % 2 === 0) ? C.bgDark : C.bgLight);
      g.fillRect(col * UNIT_SIZE, row * UNIT_SIZE, UNIT_SIZE, UNIT_SIZE);
    }
  }
}

/** 苹果：现在盘子上可能同时躺着好几颗（电脑蛇死后会下苹果雨），所以逐个画 */
function drawApples() {
  for (const a of apples) drawOneApple(a.x, a.y);
}

/** 一颗苹果：圆果子 + 亮晶晶的高光 + 头顶一片小叶子 */
function drawOneApple(x, y) {
  // 注意 fillOval 是我们自己写的函数，不是 Canvas 上下文的方法，
  // 所以必须裸调用 fillOval(...)，写成 g.fillOval(...) 会直接抛异常。
  g.fillStyle = rgb(C.apple);
  fillOval(x + 1, y + 3, UNIT_SIZE - 2, UNIT_SIZE - 4);

  g.fillStyle = rgb(C.appleShine);
  fillOval(x + 4, y + 6, 4, 3);

  g.fillStyle = rgb(C.leaf);
  fillOval(x + UNIT_SIZE / 2 - 1, y, 7, 4);
}

/** 蛇：一节一节圆滚滚的"扭扭糖"。s = 画哪条蛇，t = 这一步走了几成 */
function drawSnake(s, t) {
  // ---- 身体：从尾巴往蛇头画，深浅两色隔节相间（颜色从这条蛇自己的调色板里拿）----
  for (let i = s.parts - 1; i >= 1; i--) {
    g.fillStyle = rgb((i % 2 === 0) ? s.pal.bodyMid : s.pal.bodyDark);
    // 每节向内缩 1 像素，节与节之间留一道缝；尾巴那节多缩几像素，收出小尖
    const pad = (i === s.parts - 1) ? 5 : 1;
    fillRoundRect(segX(s, i, t) + pad, segY(s, i, t) + pad,
                  UNIT_SIZE - pad * 2, UNIT_SIZE - pad * 2, 12);
  }

  // ---- 蛇头：比身体大一圈 ----
  const hx = segX(s, 0, t);
  const hy = segY(s, 0, t);
  g.fillStyle = rgb(s.pal.head);
  fillRoundRect(hx - 1, hy - 1, UNIT_SIZE + 2, UNIT_SIZE + 2, 14);

  drawFace(s, hx, hy);
}

/**
 * 蛇头的表情。两个"方向向量"管住四个朝向：
 *   forward(fx, fy) = 脸正前方；side(sx, sy) = 左右分眼，永远和 forward 垂直
 * 换方向只是把向量里的 1 换成 -1，一套公式通吃。
 */
function drawFace(s, hx, hy) {
  const alive = s.alive;                 // 这条蛇现在是醒着还是晕了
  let fx = 0, fy = 0;
  let sx = 0, sy = 0;
  switch (s.dir) {
    case "U": fy = -1; sx = 1; break; // 朝上：两只眼左右排
    case "D": fy =  1; sx = 1; break;
    case "L": fx = -1; sy = 1; break; // 朝左：两只眼上下排
    case "R": fx =  1; sy = 1; break;
  }

  const cx = hx + UNIT_SIZE / 2; // 蛇头中心，所有五官都拿它当基准
  const cy = hy + UNIT_SIZE / 2;

  g.lineCap = "round"; // 线条两头修成圆的，不显生硬

  for (let side = -1; side <= 1; side += 2) { // -1 = 左眼，+1 = 右眼
    const ex = cx + fx * 3 + sx * 4 * side;
    const ey = cy + fy * 3 + sy * 4 * side;

    if (alive) {
      g.fillStyle = "#fff";
      fillOval(ex - 3, ey - 3, 6, 6);
      g.fillStyle = rgb(C.pupil);            // 瞳孔往前挪 1 像素 = 眼神盯着要去的方向
      fillOval(ex - 2 + fx, ey - 2 + fy, 4, 4);
    } else {
      g.strokeStyle = "#fff";                // 晕过去了：两个 X 当眼睛
      g.lineWidth = 1.6;
      g.beginPath();
      g.moveTo(ex - 3, ey - 3); g.lineTo(ex + 3, ey + 3);
      g.moveTo(ex + 3, ey - 3); g.lineTo(ex - 3, ey + 3);
      g.stroke();
    }
  }

  if (!alive) return; // 晕过去的时候舌头就收起来，不吐了

  // 小舌头：从嘴边伸出去，末端分个叉。
  // 有了连续时钟之后，还能让它按秒呼吸式地伸伸缩缩，蛇立马就"活"了。
  const flick = 0.5 + 0.5 * Math.sin(nowMs / 230); // 在 0 和 1 之间缓慢摆动
  g.strokeStyle = rgb(s.pal.tongue);     // 舌头颜色也归各自的调色板管
  g.lineWidth = 2;
  const mx = cx + fx * 9,  my = cy + fy * 9;              // 舌头根
  const tip = 10 + 9 * flick;                              // 伸出去多远
  const tx = cx + fx * tip, ty = cy + fy * tip;            // 舌头尖
  g.beginPath();
  g.moveTo(mx, my); g.lineTo(tx, ty);
  g.moveTo(tx, ty); g.lineTo(tx + fx * 3 + sx * 2, ty + fy * 3 + sy * 2);
  g.moveTo(tx, ty); g.lineTo(tx + fx * 3 - sx * 2, ty + fy * 3 - sy * 2);
  g.stroke();
}

/** 三个角的状态：左下你的得分、右下最高分、左上电脑战况。
    注意：Canvas 的 fillText 和 Java 的 drawString 一样，y 给的是"文字的基线"而不是顶边，
    所以这些坐标可以从 Java 版直接抄过来，不用重算。 */
function drawScore() {
  g.fillStyle = "#fff";
  g.font = "bold 16px 'Microsoft YaHei', sans-serif";
  g.textAlign = "left";
  g.fillText("得分 " + P.score, UNIT_SIZE, PANEL_SIZE - UNIT_SIZE / 2);

  g.textAlign = "right"; // 网页里"靠右对齐"是个现成开关，不用像 Java 那样自己量字宽
  g.fillText("最高分 " + highScore, PANEL_SIZE - UNIT_SIZE, PANEL_SIZE - UNIT_SIZE / 2);

  // 左上角盯电脑。它晕过去的时候必须把倒计时写在明面上，
  // 否则对手凭空消失，你会以为页面又坏了。
  g.textAlign = "left";
  if (E.alive) {
    g.fillStyle = rgb(E.pal.head);
    g.fillText("电脑 " + E.score, UNIT_SIZE, UNIT_SIZE * 2 - UNIT_SIZE / 2);
  } else {
    const left = Math.max(0, Math.ceil((E.respawnAt - gameMs) / 1000));
    g.fillStyle = "rgb(150, 158, 166)";
    g.fillText("电脑 " + left + " 秒后复活", UNIT_SIZE, UNIT_SIZE * 2 - UNIT_SIZE / 2);
  }
}

function gameOver(t) {
  g.globalAlpha = t;   // 字也跟着淡入，和黑纱同步
  g.textAlign = "center"; // 居中也是现成开关：x 直接给面板中线就行
  const mid = PANEL_SIZE / 2;

  g.fillStyle = "rgb(255, 180, 110)";
  g.font = "bold 32px 'Microsoft YaHei', sans-serif";
  g.fillText("蛇蛇晕过去了", mid, mid - 40);

  g.fillStyle = "#fff";
  g.font = "18px 'Microsoft YaHei', sans-serif";
  g.fillText("本局得分 " + P.score, mid, mid + 5);

  g.fillStyle = "rgb(180, 255, 170)";
  g.fillText(isTouch ? "点一下屏幕再来一次" : "按空格键再来一次", mid, mid + 35);
  g.globalAlpha = 1;   // 改完记得关回去，否则下一帧所有东西都跟着半透
}

// ============ 八、键盘：把"按了哪个键"翻译成"蛇该往哪走" ============

// 只允许"垂直方向"的按键立刻生效 —— 禁止 180 度掉头，否则蛇头会撞进自己脖子。
function turn(to) {
  if (P.dir !== to && P.dir !== BACK[to]) {
    P.dir = to;
  }
}

const KEY_MAP = {
  ArrowLeft: "L", KeyA: "L",
  ArrowRight: "R", KeyD: "R",
  ArrowUp: "U", KeyW: "U",
  ArrowDown: "D", KeyS: "D",
};

document.addEventListener("keydown", (e) => {
  // 方向键和空格在网页里默认会"滚动页面"，必须按住它，不然一按蛇没动、页面先跑了
  if (e.code === "Space" || e.code.startsWith("Arrow")) {
    e.preventDefault();
  }

  if (!P.alive) {                  // 自己晕了：这局已经结束，只认空格重开
    if (e.code === "Space") restart();
    return;
  }

  const dir = KEY_MAP[e.code];
  if (dir) turn(dir);
});

// ============ 九、触屏：手机上滑一下就算转向 ============

let touchStartX = 0;
let touchStartY = 0;

canvas.addEventListener("touchstart", (e) => {
  e.preventDefault();
  touchStartX = e.changedTouches[0].clientX;
  touchStartY = e.changedTouches[0].clientY;
}, { passive: false });

canvas.addEventListener("touchend", (e) => {
  e.preventDefault();
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;

  if (!P.alive) {           // 晕了的时候，点一下就重开
    restart();
    return;
  }

  // 滑动距离太短就当"手抖"，不算指令
  if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;

  // 哪个方向挪得多就听哪个的：横向大 → 左右，纵向大 → 上下
  if (Math.abs(dx) > Math.abs(dy)) {
    turn(dx > 0 ? "R" : "L");
  } else {
    turn(dy > 0 ? "D" : "U");
  }
}, { passive: false });

// ============ 十、切到别的标签页就自动暂停 ============

// 浏览器会把后台标签页的动画循环拖慢甚至停掉。不处理的话，你切出去回个消息，
// 回来发现蛇已经自己撞墙了 —— 这里在看不见时停循环，回来再续上。
// （loop() 里那句 dt 封顶 100 毫秒是第二道保险。）
document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    stopLoop();
  } else {
    startLoop(); // startLoop 自己会判断：已经在跑就不重复启动
  }
});

// ============ 点火 ============
newGame();
draw();        // 先画一帧，免得白屏等第一次刷新
startLoop();
</script>

</body>
</html>
