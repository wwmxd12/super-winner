<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>向僵尸开炮 Shoot the Zombies</title>
<style>
  /* 页面外壳：把画布居中，底色跟游戏里保持一致 */
  html, body {
    margin: 0;
    height: 100%;
    background: #0a0c10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    color: #a9b6c4;
    /* 手机上别让滑动页面把游戏滚走 */
    overscroll-behavior: none;
  }
  canvas {
    /* 逻辑尺寸永远是 480x640（竖屏）。窄屏手机上按宽度缩、桌面按高度缩，
       始终保住 3:4 的正经比例，不会被拉扁 */
    width: min(480px, 96vw, 72vh * 1.25);
    height: min(640px, 128vw, 96vh);
    aspect-ratio: 480 / 640;
    border-radius: 14px;
    box-shadow: 0 12px 44px rgba(0, 0, 0, .65);
    touch-action: none; /* 交给 JS 自己处理触摸，浏览器不要插手 */
    cursor: crosshair;
  }
  .hint { margin-top: 12px; font-size: 13px; text-align: center; line-height: 1.7; max-width: 92vw; }
  .hint b { color: #d7e6f2; font-weight: 600; }
  /* 调试读数：等宽字 + 淡一点，不跟游戏抢眼神 */
  #fps { margin-top: 4px; font-family: Consolas, monospace; font-size: 12px; color: #4a5a68; }
</style>
</head>
<body>

<canvas id="game"></canvas>

<p class="hint">
  <b>电脑</b>：左右移动鼠标 / <b>A D</b> 或 <b>←→</b> 平移炮台，自动瞄准开火 · <b>空格</b> 开始/重开<br>
  <b>手机</b>：手指在屏幕上<b>左右拖动</b>就带着炮台走，松开继续自动开火<br>
  僵尸一波波从<b>上方</b>涌下来，冲到<b>城墙</b>就掉血；打怪攒<b>经验</b>，<b>升级</b>时三张强化卡选一张，越打越猛<br>
  每隔几波会杀出一只<b>巨型 Boss</b>，撑到算你狠
</p>
<p id="fps">读数初始化中…</p>

<script>
"use strict";

/* =====================================================================
   《向僵尸开炮》—— 底部炮台自动索敌，僵尸从上往下涌的竖屏割草射击。
   这份是 GamePanel.java 的"网页孪生版"，方法名、执行顺序刻意跟 Java 那份
   一一对应，方便你拿两边对照着读。
   ===================================================================== */

// ============ 一、战场的物理设定 ============
const W = 480;          // 逻辑宽（像素）
const H = 640;          // 逻辑高
const WALL_Y = H - 56;  // 城墙顶沿的 y：僵尸越过这条线就啃墙
const CANNON_Y = WALL_Y + 6; // 炮台基座贴在城墙上方一点

// ============ 二、配色表：想换造型只改这里 ============
const C = {
  skyTop:   [16, 20, 28],
  skyBot:   [26, 32, 44],
  grid:     [40, 50, 66],
  wallTop:  [88, 98, 116],
  wallBody: [54, 62, 78],
  cannon:   [120, 170, 232],
  cannonDark:[54, 96, 158],
  barrel:   [206, 224, 248],
  muzzle:   [255, 226, 128],
  bullet:   [255, 214, 92],
  hp:       [92, 220, 130],
  hpLow:    [240, 96, 96],
  xp:       [122, 196, 255],
  textDim:  [150, 166, 184],
  card:     [30, 38, 52],
  cardEdge: [120, 170, 232],
};
const rgb = (c, a) => (a === undefined)
  ? `rgb(${c[0]}, ${c[1]}, ${c[2]})`
  : `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${a})`;

// 僵尸种类：颜色 + 体型 + 基础血量倍率 + 速度倍率，加新怪只在这里多写一行
const ZTYPE = {
  walker: { r: 15, hp: 1.0, spd: 1.0, col: [96, 176, 92],  pts: 10 },
  runner: { r: 11, hp: 0.6, spd: 1.9, col: [208, 150, 70], pts: 15 },
  tank:   { r: 22, hp: 3.4, spd: 0.62, col: [150, 84, 170], pts: 30 },
  boss:   { r: 38, hp: 20,  spd: 0.5,  col: [220, 72, 84],  pts: 300 },
};

// ============ 三、画布：相当于 Java 里那个 JPanel ============
const canvas = document.getElementById("game");
const g = canvas.getContext("2d");

// 高分屏适配：把画布真实分辨率放大 DPR 倍再缩放笔，坐标系照旧 0~W / 0~H，边缘不糊。
const DPR = Math.min(window.devicePixelRatio || 1, 2);
canvas.width = W * DPR;
canvas.height = H * DPR;
g.scale(DPR, DPR);

// ============ 四、玩家（炮台 + 一堆成长属性）============
const player = {
  x: W / 2, wantX: W / 2, r: 20,   // 炮台中心 x、想去的 x、碰撞半径
  aim: -Math.PI / 2,               // 炮管朝向（弧度，-90°=正上方）

  hp: 100, maxHp: 100,             // 城墙血量
  dmg: 6,                          // 单发子弹伤害
  fireInterval: 320,               // 每多少毫秒开一炮（越小越快）
  bulletSpeed: 460,                // 子弹速度 px/s
  shots: 1,                        // 一次散射几发
  pierce: 0,                       // 一发子弹能额外穿几个怪
  slowPct: 0,                      // 减速光环：全场僵尸慢百分之几

  xp: 0, level: 1, xpNext: 12,     // 经验条与升级门槛
  fireCd: 0,                       // 距离下一炮还攒够毫秒没
  flash: 0,                        // 炮口火光剩余时间
  shake: 0,                        // 屏幕震动强度
};

let wave = 1;            // 第几波
let waveTimer = 0;       // 本波已经打了多少毫秒
let spawnCd = 0;         // 距离下一只僵尸出场的毫秒
let kills = 0;           // 累计击杀
let score = 0;           // 得分

const zombies = [];      // 场上僵尸
const bullets = [];      // 场上子弹
const parts = [];        // 死亡碎片粒子
const floaters = [];     // 飘字（伤害数字 / +经验）
const cards = [];        // 升级三选一卡片

// 状态机：ready 待开始 / playing 进行中 / levelup 升级选卡暂停 / over 结束
let state = "ready";
let overMsg = "";

const isTouch = window.matchMedia("(pointer: coarse)").matches;

// 最高分存 localStorage，下次打开还在
const HS_KEY = "zombie-high-score";
let highScore = 0;
try { highScore = Number(localStorage.getItem(HS_KEY)) || 0; }
catch (e) { highScore = 0; }

// 时间轴
let rafId = null, lastFrame = 0, gameMs = 0, nowSec = 0;
let fpsAcc = 0, fpsCount = 0, fpsShown = 0;

const rnd = (n) => Math.floor(Math.random() * n);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);

// ============ 五、波次与出场 ============

/** 当前波每只僵尸的血量倍率：越往后越硬 */
function waveHp()   { return 1 + (wave - 1) * 0.32; }
/** 出场间隔（毫秒）：波数越高催得越紧 */
function spawnGap() { return Math.max(260, 1050 - wave * 68); }

/** 按当前波数决定该出哪种怪 */
function pickType() {
  const roll = Math.random();
  if (wave >= 3 && roll < 0.16) return "runner";
  if (wave >= 4 && roll < 0.28) return "tank";
  if (roll < 0.7) return "walker";
  return "runner";
}

/** 放一只某类型的僵尸到顶部随机列 */
function spawnZombie(type) {
  const t = ZTYPE[type];
  const x = rand(30, W - 30);
  zombies.push({
    x: x, y: -t.r,
    r: t.r, type: type,
    hp: t.hp * waveHp(), maxHp: t.hp * waveHp(),
    spd: rand(38, 52) * t.spd,   // 基础下压速度 * 类型倍率
    wob: rand(0, 6.28),          // 走路左右摇摆的相位，纯表演
    flash: 0,
  });
  // Boss 血厚、居中偏一点出场，顺便震一下屏
  if (type === "boss") { player.shake = Math.max(player.shake, 8); }
}

/** 每波到点就推进波数；逢 5 的倍数加一只 Boss */
function tickWave(dt) {
  waveTimer += dt;
  if (waveTimer >= 16000) {   // 每 16 秒进下一波
    waveTimer = 0;
    wave++;
    if (wave % 5 === 0) spawnZombie("boss");
    floatUp(W / 2, 96, "第 " + wave + " 波", [255, 226, 128], 22);
  }
}

/** 攒够出场间隔就放一只 */
function tickSpawn(dt) {
  spawnCd -= dt;
  if (spawnCd <= 0) {
    spawnCd = spawnGap();
    spawnZombie(pickType());
  }
}

// ============ 六、炮台：索敌、开火 ============

/** 找到离炮台最近的一只僵尸作为目标；没有返回 null */
function nearestZombie() {
  let best = null, bd = Infinity;
  for (const z of zombies) {
    const d = dist(player.x, CANNON_Y, z.x, z.y);
    if (d < bd) { bd = d; best = z; }
  }
  return best;
}

/** 炮管朝目标转过去，并开火 */
function tickCannon(dt) {
  const tgt = nearestZombie();
  // 有怪就瞄向它，没怪就抬回正上方
  const aimTo = tgt ? Math.atan2(tgt.y - CANNON_Y, tgt.x - player.x) : -Math.PI / 2;
  // 平滑转向：朝目标角度一点点转，别"咔"一下瞬移
  let diff = aimTo - player.aim;
  while (diff > Math.PI) diff -= Math.PI * 2;
  while (diff < -Math.PI) diff += Math.PI * 2;
  player.aim += diff * Math.min(1, dt / 60);

  player.fireCd -= dt;
  if (player.fireCd <= 0 && tgt) {
    fireVolley();
    player.fireCd = player.fireInterval;
  }
}

/** 按当前 shots/pierce 打出一轮弹幕 */
function fireVolley() {
  const n = player.shots;
  const gap = 11;   // 多弹横向间隔：方向完全一致、只是左右并排，飞多远都还是一束，不会散开打空
  const mx = player.x + Math.cos(player.aim) * (player.r + 8);   // 炮口中心
  const my = CANNON_Y + Math.sin(player.aim) * (player.r + 8);
  const nx = -Math.sin(player.aim);   // 垂直于瞄准方向的“横向”单位向量，用来左右排开
  const ny = Math.cos(player.aim);
  const vx = Math.cos(player.aim) * player.bulletSpeed;           // 所有子弹同向平行
  const vy = Math.sin(player.aim) * player.bulletSpeed;
  for (let i = 0; i < n; i++) {
    const off = (i - (n - 1) / 2) * gap;                          // 相对中心左右对称排开
    bullets.push({
      x: mx + nx * off, y: my + ny * off,
      vx: vx, vy: vy,
      dmg: player.dmg, pierce: player.pierce, hit: 0, r: 4,
    });
  }
  player.flash = 90;   // 炮口亮一下
}

// ============ 七、子弹与僵尸的移动、碰撞 ============

function tickBullets(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx * dt / 1000;
    b.y += b.vy * dt / 1000;
    // 飞出屏幕就回收
    if (b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) {
      bullets.splice(i, 1); continue;
    }
    // 撞僵尸
    for (let j = zombies.length - 1; j >= 0; j--) {
      const z = zombies[j];
      if (dist(b.x, b.y, z.x, z.y) < z.r + b.r) {
        hitZombie(z, j, b.dmg);
        b.hit++;
        if (b.hit > b.pierce) { bullets.splice(i, 1); }
        break;
      }
    }
  }
}

function tickZombies(dt) {
  const slow = 1 - player.slowPct / 100;   // 减速光环全局系数
  for (let i = zombies.length - 1; i >= 0; i--) {
    const z = zombies[i];
    z.y += z.spd * slow * dt / 1000;
    z.wob += dt / 1000 * 6;
    if (z.flash > 0) z.flash -= dt;
    // 越过城墙线：啃墙一口，自己化作血浆消失
    if (z.y + z.r >= WALL_Y) {
      const bite = z.type === "boss" ? 26 : z.type === "tank" ? 12 : 7;
      damageWall(bite);
      burst(z.x, WALL_Y, [190, 60, 70], 10);
      zombies.splice(i, 1);
    }
  }
}

/** 对僵尸造成 dmg 伤害；死了就结算分数/经验并爆碎片 */
function hitZombie(z, index, dmg) {
  z.hp -= dmg;
  z.flash = 90;
  floatUp(z.x, z.y - z.r, "-" + Math.round(dmg), [255, 255, 255], 12);
  if (z.hp <= 0) killZombie(z, index);
}

function killZombie(z, index) {
  const t = ZTYPE[z.type];
  score += t.pts;
  kills++;
  burst(z.x, z.y, t.col, z.type === "boss" ? 26 : 12);
  gainXp(z.type === "boss" ? 8 : 1);
  if (z.type === "boss") player.shake = Math.max(player.shake, 10);
  zombies.splice(index, 1);
}

function damageWall(amount) {
  player.hp -= amount;
  player.shake = Math.max(player.shake, 7);
  floatUp(W / 2, WALL_Y - 12, "-" + amount, [240, 96, 96], 16);
  if (player.hp <= 0) {
    player.hp = 0;
    gameOver();
  }
}

// ============ 八、升级选卡 ============

// 稀有度分级：N 常见 → R → SR → SSR → UR → EX 神话。w 是抽卡权重（越大越常见）
const RARITY = [
  { name: "N",   col: [150, 166, 184], w: 100 },
  { name: "R",   col: [86, 156, 255],  w: 55  },
  { name: "SR",  col: [178, 110, 240], w: 26  },
  { name: "SSR", col: [255, 176, 64],  w: 11  },
  { name: "UR",  col: [255, 86, 120],  w: 4   },
  { name: "EX",  col: [64, 224, 208],  w: 2   },
];

// 强化卡池：同一效果按稀有度分成几档，r 指向 RARITY 下标。想加新强化只在这里多写一条
const UPGRADES = [
  // 伤害
  { r: 0, title: "火力强化", desc: "单发伤害 +25%",   apply: () => player.dmg *= 1.25 },
  { r: 1, title: "高爆弹头", desc: "单发伤害 +45%",   apply: () => player.dmg *= 1.45 },
  { r: 2, title: "湮灭弹头", desc: "单发伤害 +75%",   apply: () => player.dmg *= 1.75 },
  // 攻速（三档拉开差距）
  { r: 0, title: "高射炮",   desc: "攻速 +12%",       apply: () => player.fireInterval = Math.max(60, player.fireInterval * 0.89) },
  { r: 1, title: "加特林",   desc: "攻速 +22%",       apply: () => player.fireInterval = Math.max(60, player.fireInterval * 0.80) },
  { r: 2, title: "死亡风暴", desc: "攻速 +35%",       apply: () => player.fireInterval = Math.max(60, player.fireInterval * 0.70) },
  // 子弹飞行速度（新增词条）
  { r: 0, title: "提速弹匣", desc: "弹速 +18%",       apply: () => player.bulletSpeed *= 1.18 },
  { r: 2, title: "电磁轨道", desc: "弹速 +40%",       apply: () => player.bulletSpeed *= 1.40 },
  // 弹幕
  { r: 1, title: "分裂炮管", desc: "弹幕 +1 发",      apply: () => player.shots += 1 },
  { r: 2, title: "多重炮管", desc: "弹幕 +2 发",      apply: () => player.shots += 2 },
  { r: 3, title: "弹幕领域", desc: "弹幕 +3 发",      apply: () => player.shots += 3 },
  // 穿透
  { r: 1, title: "穿甲弹",   desc: "穿透 +1",         apply: () => player.pierce += 1 },
  { r: 3, title: "磁轨贯穿", desc: "穿透 +2",         apply: () => player.pierce += 2 },
  // 减速
  { r: 1, title: "冰缓立场", desc: "僵尸减速 +10%",   apply: () => player.slowPct = Math.min(75, player.slowPct + 10) },
  { r: 3, title: "时间凝滞", desc: "僵尸减速 +22%",   apply: () => player.slowPct = Math.min(75, player.slowPct + 22) },
  // 城墙
  { r: 0, title: "修补城墙", desc: "立即回复 35 血",  apply: () => { player.hp = Math.min(player.maxHp, player.hp + 35); } },
  { r: 1, title: "加固城墙", desc: "上限 +30 并回 30", apply: () => { player.maxHp += 30; player.hp = Math.min(player.maxHp, player.hp + 30); } },
  { r: 2, title: "合金长城", desc: "上限 +70 并回满", apply: () => { player.maxHp += 70; player.hp = player.maxHp; } },
  // 顶级组合
  { r: 4, title: "双管齐下", desc: "弹幕 +2 且攻速 +15%", apply: () => { player.shots += 2; player.fireInterval = Math.max(60, player.fireInterval * 0.87); } },
  { r: 5, title: "天基裁决", desc: "伤害 +120% 且穿透 +1", apply: () => { player.dmg *= 2.2; player.pierce += 1; } },
];

function gainXp(n) {
  player.xp += n;
  while (player.xp >= player.xpNext) {
    player.xp -= player.xpNext;
    player.level++;
    player.xpNext = Math.round(player.xpNext * 1.4) + 4;
    openLevelUp();
  }
}

/** 按稀有度权重抽 3 张不重复的强化卡（EX 极稀有），切到选卡界面（逻辑暂停） */
function openLevelUp() {
  cards.length = 0;
  const pool = UPGRADES.slice();
  for (let k = 0; k < 3 && pool.length; k++) {
    let total = 0;
    for (const u of pool) total += RARITY[u.r].w;
    let roll = Math.random() * total, pick = 0;
    for (let i = 0; i < pool.length; i++) {
      roll -= RARITY[pool[i].r].w;
      if (roll <= 0) { pick = i; break; }
    }
    cards.push(pool.splice(pick, 1)[0]);
  }
  layoutCards();
  state = "levelup";
}

/** 三张竖排卡片的矩形，方便点击命中检测和绘制共用 */
function layoutCards() {
  const cw = 300, ch = 62, gap = 14;
  const totalH = cards.length * ch + (cards.length - 1) * gap;
  const y0 = (H - totalH) / 2;
  for (let i = 0; i < cards.length; i++) {
    cards[i].rect = { x: (W - cw) / 2, y: y0 + i * (ch + gap), w: cw, h: ch };
  }
}

function chooseCard(i) {
  if (!cards[i]) return;
  cards[i].apply();
  floatUp(W / 2, H / 2 - 60, cards[i].title, [122, 196, 255], 20);
  state = "playing";
}

// ============ 九、粒子与飘字 ============

function burst(x, y, col, n) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, 6.28), s = rand(40, 220);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(280, 620), max: 620, col, sz: rand(2, 4) });
  }
}

function floatUp(x, y, text, col, size) {
  floaters.push({ x, y, vy: -34, life: 700, max: 700, text, col, size });
}

function tickEffects(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.x += p.vx * dt / 1000; p.y += p.vy * dt / 1000;
    p.vy += 520 * dt / 1000;  // 给碎片一点重力，散落更自然
    p.life -= dt;
    if (p.life <= 0) parts.splice(i, 1);
  }
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.y += f.vy * dt / 1000;
    f.life -= dt;
    if (f.life <= 0) floaters.splice(i, 1);
  }
  if (player.flash > 0) player.flash -= dt;
  if (player.shake > 0) player.shake = Math.max(0, player.shake - dt / 40);
}


// ============ 十、玩家移动（键鼠 + 触摸共用一套 wantX）============
const keys = { left: false, right: false };
const MOVE_SPEED = 380;   // 键盘平移速度 px/s

/** 把炮台夹在战场左右留一点边距内 */
function clampCannon() {
  player.wantX = clamp(player.wantX, player.r + 4, W - player.r - 4);
}

/** 键盘：左右键 / AD 持续推动 wantX */
function tickKeyboard(dt) {
  if (keys.left)  player.wantX -= MOVE_SPEED * dt / 1000;
  if (keys.right) player.wantX += MOVE_SPEED * dt / 1000;
  clampCannon();
}

/** 指针（鼠标移动 / 触摸拖动）把 wantX 直接设成手指横坐标 */
function pointerToLogicalX(clientX) {
  const r = canvas.getBoundingClientRect();
  return (clientX - r.left) / r.width * W;
}

window.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = true;
  if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = true;
  if (e.key === " ") { e.preventDefault(); onPrimary(); }
  if (state === "levelup") {
    if (e.key === "1") chooseCard(0);
    if (e.key === "2") chooseCard(1);
    if (e.key === "3") chooseCard(2);
  }
});
window.addEventListener("keyup", (e) => {
  if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = false;
  if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = false;
});

canvas.addEventListener("pointermove", (e) => {
  if (state !== "playing") return;
  player.wantX = pointerToLogicalX(e.clientX);
  clampCannon();
});

canvas.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  const lx = pointerToLogicalX(e.clientX);
  const ly = (e.clientY - canvas.getBoundingClientRect().top) / canvas.getBoundingClientRect().height * H;
  if (state === "levelup") {
    for (let i = 0; i < cards.length; i++) {
      const rc = cards[i].rect;
      if (lx >= rc.x && lx <= rc.x + rc.w && ly >= rc.y && ly <= rc.y + rc.h) { chooseCard(i); return; }
    }
    return;
  }
  // 待开始 / 结束时点屏=开始或重开；进行中点屏则炮台跟到手指
  if (state === "playing") { player.wantX = lx; clampCannon(); }
  else onPrimary();
});

/** 空格 / 点屏 的"主操作"：按当前状态决定是开局、还是重开 */
function onPrimary() {
  if (state === "ready") { startGame(); }
  else if (state === "over") { startGame(); }
}

// ============ 十一、一帧的逻辑更新 ============

function update(dt) {
  tickKeyboard(dt);
  // 炮台实际位置朝 wantX 平滑靠拢，键盘/鼠标/触摸都只改目标，动作就很"跟手"
  player.x += (player.wantX - player.x) * Math.min(1, dt / 90);

  tickWave(dt);
  tickSpawn(dt);
  tickCannon(dt);
  tickBullets(dt);
  tickZombies(dt);
  tickEffects(dt);
}

// ============ 十二、开始 / 结束 ============

function startGame() {
  player.x = player.wantX = W / 2;
  player.aim = -Math.PI / 2;
  player.hp = player.maxHp = 100;
  player.dmg = 6; player.fireInterval = 320; player.bulletSpeed = 460;
  player.shots = 1; player.pierce = 0; player.slowPct = 0;
  player.xp = 0; player.level = 1; player.xpNext = 12;
  player.fireCd = 0; player.flash = 0; player.shake = 0;

  wave = 1; waveTimer = 0; spawnCd = 300; kills = 0; score = 0;
  zombies.length = 0; bullets.length = 0; parts.length = 0; floaters.length = 0; cards.length = 0;

  gameMs = 0;
  state = "playing";
}

function gameOver() {
  state = "over";
  overMsg = "撑到第 " + wave + " 波 · 击杀 " + kills;
  if (score > highScore) {
    highScore = score;
    try { localStorage.setItem(HS_KEY, String(highScore)); } catch (e) {}
  }
}

// ============ 十三、把当前状态画到屏幕上 ============

/** 圆角矩形小工具（Canvas 没有现成的，Java 版用 fillRoundRect 那种）*/
function roundRect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

function drawBackground() {
  // 天空渐变：从上往下由深到稍亮
  const grd = g.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0, rgb(C.skyTop));
  grd.addColorStop(1, rgb(C.skyBot));
  g.fillStyle = grd;
  g.fillRect(0, 0, W, H);

  // 淡淡的网格，给点"战场地板"的感觉
  g.strokeStyle = rgb(C.grid, 0.25);
  g.lineWidth = 1;
  for (let x = 0; x <= W; x += 40) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, WALL_Y); g.stroke(); }
  for (let y = 0; y <= WALL_Y; y += 40) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
}

function drawWall() {
  // 城墙本体
  g.fillStyle = rgb(C.wallBody);
  g.fillRect(0, WALL_Y, W, H - WALL_Y);
  g.fillStyle = rgb(C.wallTop);
  g.fillRect(0, WALL_Y, W, 8);

  // 血量条压在墙顶：绿→红随血量变化
  const p = clamp(player.hp / player.maxHp, 0, 1);
  const col = p > 0.35 ? C.hp : C.hpLow;
  g.fillStyle = rgb([20, 24, 32]);
  g.fillRect(10, WALL_Y + 14, W - 20, 14);
  g.fillStyle = rgb(col);
  g.fillRect(10, WALL_Y + 14, (W - 20) * p, 14);
  g.strokeStyle = rgb([0, 0, 0], 0.4);
  g.lineWidth = 2; g.strokeRect(10, WALL_Y + 14, W - 20, 14);
  g.fillStyle = rgb([255, 255, 255]);
  g.font = "bold 11px 'Microsoft YaHei'";
  g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText(Math.ceil(player.hp) + " / " + player.maxHp, W / 2, WALL_Y + 21);
}

/** 一只僵尸：身体 blob + 走位摇摆 + 双眼 + 受击闪白 + 头顶血条 */
function drawZombie(z) {
  const t = ZTYPE[z.type];
  const bob = Math.sin(z.wob) * (z.r * 0.12);
  const x = z.x, y = z.y + bob;

  g.save();
  g.translate(x, y);
  // 手臂：两条小短线随相位摆动
  g.strokeStyle = rgb(t.col);
  g.lineWidth = Math.max(3, z.r * 0.28);
  g.lineCap = "round";
  g.beginPath();
  g.moveTo(-z.r * 0.6, 0); g.lineTo(-z.r * 1.1, z.r * 0.5 + bob);
  g.moveTo(z.r * 0.6, 0);  g.lineTo(z.r * 1.1,  z.r * 0.5 - bob);
  g.stroke();
  // 身体
  g.fillStyle = rgb(t.col);
  g.beginPath(); g.ellipse(0, 0, z.r, z.r * 1.05, 0, 0, 6.283); g.fill();
  // 受击闪白蒙一层
  if (z.flash > 0) {
    g.fillStyle = rgb([255, 255, 255], clamp(z.flash / 90, 0, 1) * 0.8);
    g.beginPath(); g.ellipse(0, 0, z.r, z.r * 1.05, 0, 0, 6.283); g.fill();
  }
  // 眼睛（凶一点的红色小点）
  g.fillStyle = rgb([30, 12, 12]);
  g.beginPath(); g.arc(-z.r * 0.35, -z.r * 0.15, z.r * 0.16, 0, 6.283);
  g.arc(z.r * 0.35, -z.r * 0.15, z.r * 0.16, 0, 6.283); g.fill();
  g.restore();

  // 血条（非满血才画，免得屏幕太碎）
  if (z.hp < z.maxHp) {
    const w = z.r * 2, p = clamp(z.hp / z.maxHp, 0, 1);
    g.fillStyle = rgb([0, 0, 0], 0.5);
    g.fillRect(x - w / 2, y - z.r - 8, w, 4);
    g.fillStyle = rgb(C.hp);
    g.fillRect(x - w / 2, y - z.r - 8, w * p, 4);
  }
}

/** 炮台：基座 + 随索敌转动的炮管 + 开火时的炮口火光 */
function drawCannon() {
  const x = player.x, y = CANNON_Y;
  // 炮管
  g.save();
  g.translate(x, y);
  g.rotate(player.aim);
  g.fillStyle = rgb(C.barrel);
  roundRect(0, -5, player.r + 16, 10, 5); g.fill();
  // 炮口火光
  if (player.flash > 0) {
    const f = clamp(player.flash / 90, 0, 1);
    g.fillStyle = rgb(C.muzzle, f);
    g.beginPath(); g.arc(player.r + 16, 0, 8 + 10 * f, 0, 6.283); g.fill();
  }
  g.restore();

  // 基座（半圆炮塔）
  g.fillStyle = rgb(C.cannonDark);
  g.beginPath(); g.arc(x, y + 4, player.r + 4, Math.PI, 0); g.fill();
  g.fillStyle = rgb(C.cannon);
  g.beginPath(); g.arc(x, y + 2, player.r, Math.PI, 0); g.fill();
  // 高光小点，增加体积感
  g.fillStyle = rgb([255, 255, 255], 0.25);
  g.beginPath(); g.arc(x - player.r * 0.35, y - player.r * 0.35, player.r * 0.28, 0, 6.283); g.fill();
}

function drawBullets() {
  g.fillStyle = rgb(C.bullet);
  g.shadowColor = rgb(C.bullet, 0.9);
  g.shadowBlur = 8;
  for (const b of bullets) {
    g.beginPath(); g.arc(b.x, b.y, b.r, 0, 6.283); g.fill();
  }
  g.shadowBlur = 0;
}

function drawParts() {
  for (const p of parts) {
    g.fillStyle = rgb(p.col, clamp(p.life / p.max, 0, 1));
    g.fillRect(p.x - p.sz / 2, p.y - p.sz / 2, p.sz, p.sz);
  }
}

function drawFloaters() {
  g.textAlign = "center"; g.textBaseline = "middle";
  for (const f of floaters) {
    g.globalAlpha = clamp(f.life / f.max, 0, 1);
    g.fillStyle = rgb(f.col);
    g.font = "bold " + f.size + "px 'Microsoft YaHei'";
    g.fillText(f.text, f.x, f.y);
  }
  g.globalAlpha = 1;
}

/** 顶部 HUD：波数、得分、等级与经验条 */
function drawHud() {
  g.textBaseline = "middle";
  g.fillStyle = rgb([255, 255, 255]);
  g.font = "bold 18px 'Microsoft YaHei'";
  g.textAlign = "left";
  g.fillText("第 " + wave + " 波", 12, 20);
  g.textAlign = "right";
  g.fillText("得分 " + score, W - 12, 20);

  // 经验条压在顶部
  const xp = clamp(player.xp / player.xpNext, 0, 1);
  g.fillStyle = rgb([20, 24, 32]);
  g.fillRect(12, 34, W - 24, 8);
  g.fillStyle = rgb(C.xp);
  g.fillRect(12, 34, (W - 24) * xp, 8);
  g.fillStyle = rgb(C.textDim);
  g.font = "11px 'Microsoft YaHei'";
  g.textAlign = "center";
  g.fillText("Lv." + player.level, W / 2, 50);
}

/** 覆盖层文字：待开始 / 游戏结束 */
function drawOverlay() {
  g.fillStyle = rgb([6, 8, 12], 0.72);
  g.fillRect(0, 0, W, H);
  g.textAlign = "center"; g.textBaseline = "middle";
  if (state === "ready") {
    g.fillStyle = rgb([255, 226, 128]);
    g.font = "bold 40px 'Microsoft YaHei'";
    g.fillText("向僵尸开炮", W / 2, H / 2 - 60);
    g.fillStyle = rgb([255, 255, 255]);
    g.font = "16px 'Microsoft YaHei'";
    g.fillText(isTouch ? "点一下屏幕开始" : "按空格 / 点击开始", W / 2, H / 2 + 4);
    g.fillStyle = rgb(C.textDim);
    g.font = "13px 'Microsoft YaHei'";
    g.fillText("最高分 " + highScore, W / 2, H / 2 + 34);
  } else if (state === "over") {
    g.fillStyle = rgb([240, 96, 96]);
    g.font = "bold 38px 'Microsoft YaHei'";
    g.fillText("城墙失守", W / 2, H / 2 - 66);
    g.fillStyle = rgb([255, 255, 255]);
    g.font = "16px 'Microsoft YaHei'";
    g.fillText(overMsg, W / 2, H / 2 - 20);
    g.fillText("得分 " + score + " · 最高 " + highScore, W / 2, H / 2 + 6);
    g.fillStyle = rgb([255, 226, 128]);
    g.font = "bold 16px 'Microsoft YaHei'";
    g.fillText(isTouch ? "点一下再来一局" : "按空格再来一局", W / 2, H / 2 + 46);
  }
}

/** 升级选卡界面：半透明纱 + 三张竖排强化卡 */
function drawLevelUp() {
  g.fillStyle = rgb([6, 8, 12], 0.7);
  g.fillRect(0, 0, W, H);
  g.textAlign = "center"; g.textBaseline = "middle";
  g.fillStyle = rgb([122, 196, 255]);
  g.font = "bold 26px 'Microsoft YaHei'";
  g.fillText("升级！选一个强化", W / 2, cards[0] ? cards[0].rect.y - 48 : 160);

  for (let i = 0; i < cards.length; i++) {
    const rc = cards[i].rect;
    const rar = RARITY[cards[i].r];
    g.fillStyle = rgb(C.card);
    roundRect(rc.x, rc.y, rc.w, rc.h, 10); g.fill();
    // 边框按稀有度上色，SSR 及以上描粗一点
    g.strokeStyle = rgb(rar.col, 0.95); g.lineWidth = cards[i].r >= 3 ? 3 : 2;
    roundRect(rc.x, rc.y, rc.w, rc.h, 10); g.stroke();

    // 右上角稀有度徽章
    const bw = 36, bh = 22, bx = rc.x + rc.w - bw - 10, by = rc.y + (rc.h - bh) / 2;
    g.fillStyle = rgb(rar.col, 0.18);
    roundRect(bx, by, bw, bh, 6); g.fill();
    g.strokeStyle = rgb(rar.col, 0.9); g.lineWidth = 1.5;
    roundRect(bx, by, bw, bh, 6); g.stroke();
    g.fillStyle = rgb(rar.col); g.font = "bold 13px 'Microsoft YaHei'";
    g.textAlign = "center";
    g.fillText(rar.name, bx + bw / 2, by + bh / 2 + 1);

    g.textAlign = "left";
    g.fillStyle = rgb([255, 255, 255]);
    g.font = "bold 18px 'Microsoft YaHei'";
    g.fillText((i + 1) + ". " + cards[i].title, rc.x + 16, rc.y + 22);
    g.fillStyle = rgb(C.textDim);
    g.font = "13px 'Microsoft YaHei'";
    g.fillText(cards[i].desc, rc.x + 16, rc.y + 44);
  }
  g.textAlign = "center";
  g.fillStyle = rgb(C.textDim);
  g.font = "12px 'Microsoft YaHei'";
  g.fillText(isTouch ? "点击卡片选择" : "按 1 / 2 / 3 选择", W / 2, cards.length ? cards[cards.length - 1].rect.y + cards[cards.length - 1].rect.h + 24 : 400);
}

/** 一帧画面总调度 */
function draw() {
  // 屏幕震动：整体平移一点点，制造打击感
  const sh = player.shake;
  const ox = sh > 0 ? rand(-sh, sh) : 0;
  const oy = sh > 0 ? rand(-sh, sh) : 0;
  g.save();
  g.translate(ox, oy);

  drawBackground();
  drawWall();
  drawParts();
  for (const z of zombies) drawZombie(z);
  drawBullets();
  drawCannon();
  drawFloaters();
  drawHud();

  g.restore();

  if (state === "levelup") drawLevelUp();
  else if (state === "ready" || state === "over") drawOverlay();
}

// ============ 十四、游戏循环：逻辑按毫秒走，画面每帧刷 ============

function loop(ts) {
  rafId = requestAnimationFrame(loop);
  if (!lastFrame) lastFrame = ts;
  let dt = ts - lastFrame;
  lastFrame = ts;
  // 切后台回来会有一个巨大的 dt，封顶 100 毫秒防止僵尸"瞬移"
  if (dt > 100) dt = 100;
  nowSec = ts / 1000;

  if (state === "playing") { gameMs += dt; update(dt); }
  else { tickEffects(dt); }   // 暂停/选卡/结束时也让粒子和飘字收个尾

  draw();

  // 帧率读数
  fpsAcc += dt; fpsCount++;
  if (fpsAcc >= 500) {
    fpsShown = Math.round(1000 / (fpsAcc / fpsCount));
    fpsAcc = 0; fpsCount = 0;
    const el = document.getElementById("fps");
    if (el) el.textContent = fpsShown + " fps · 僵尸 " + zombies.length + " · 子弹 " + bullets.length;
  }
}

function startLoop() { if (rafId === null) { lastFrame = 0; rafId = requestAnimationFrame(loop); } }
function stopLoop() { if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; } }

// ============ 十五、切到别的标签页就自动暂停 ============
document.addEventListener("visibilitychange", () => {
  if (document.hidden) stopLoop();
  else startLoop();
});

// ============ 点火 ============
startLoop();

</script>

</body>
</html>
